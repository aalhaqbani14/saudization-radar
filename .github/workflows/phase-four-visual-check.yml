name: Phase IV screenshot geometry review
'on':
  push:
    branches: [feat/reference-faithful-dashboard-20261118]
    paths:
      - '.github/workflows/phase-four-visual-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare headless browser
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install chromium
      - name: Render reference-size browser and inspect real element bounds
        shell: bash
        run: |
          mkdir -p preview
          (python -m http.server 8765 >/tmp/radar-preview-server.log 2>&1 &)
          sleep 3
          python - <<'PY'
          import json,asyncio,os
          from playwright.async_api import async_playwright
          async def run():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
                  page=await browser.new_page(viewport={'width':1584,'height':929},device_scale_factor=1,locale='ar-SA',timezone_id='Asia/Riyadh',reduced_motion='reduce')
                  errors=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  await page.goto('http://127.0.0.1:8765/index.html',wait_until='domcontentloaded',timeout=40000)
                  await page.wait_for_timeout(3200)
                  await page.evaluate('''() => {
                    const x=document.getElementById('radar-cinematic-intro');
                    if(x){x.classList.add('radar-intro-hidden');x.style.display='none'}
                    const y=document.getElementById('radar-intro-replay');
                    if(y){y.style.display='none'}
                  }''')
                  selectors=['.sidebar','.topbar','.hero','.v3-metrics','.v3-overview','.v3-features','.v3-bottom-grid']
                  info={}
                  for q in selectors:
                      loc=page.locator(q)
                      el=await loc.bounding_box()
                      if el:info[q]={k:round(v,1) for k,v in el.items()}
                  values=await page.evaluate('''() => ({
                    bodyW:document.body.scrollWidth,viewportW:innerWidth,
                    kpis:[...document.querySelectorAll('.v3-metrics strong')].map(x=>x.innerText),
                    imageLoaded:document.querySelector('.hero-kafd-photo')?.naturalWidth>0,
                    sidebarLinks:document.querySelectorAll('.sidebar nav a').length,
                    modules:document.querySelectorAll('.v3-overview>.v3-insight').length,
                    shortcuts:document.querySelectorAll('.v3-features .quick-action').length,
                    bottomCards:document.querySelectorAll('.v3-bottom-grid>.v3-insight').length,
                    date:document.getElementById('v4-today-date')?.innerText,
                    visits:document.getElementById('v2-visit-note')?.innerText?.slice(0,80)
                  })''')
                  print('REFERENCE_LAYOUT_BOUNDS',json.dumps(info,ensure_ascii=False),flush=True)
                  print('REFERENCE_LAYOUT_DATA',json.dumps(values,ensure_ascii=False),flush=True)
                  print('PAGE_ERRORS',json.dumps(errors[:10],ensure_ascii=False),flush=True)
                  await page.screenshot(path='preview/v4-reference-layout.png',full_page=False,animations='disabled')
                  # Browser interaction should remain usable
                  await page.locator('#services-toggle').click()
                  print('DRAWER_OPENED',await page.locator('#services-panel').is_visible(),flush=True)
                  await page.keyboard.press('Escape')
                  print('DRAWER_CLOSED',not await page.locator('#services-panel').is_visible(),flush=True)
                  await browser.close()
          asyncio.run(run())
          PY
      - name: Commit screenshot to feature branch for visual inspection (deleted before merge)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/v4-reference-layout.png
          git commit -m "Temporary visual-reference screenshot for human review"
          git push origin HEAD:feat/reference-faithful-dashboard-20261118
