name: Saudization Radar monitor

'on':
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'guide_pdf_monitor.py'
      - 'test_guide_pdf_monitor.py'
      - 'guide-changes.html'
      - 'data/guide-pdf-sources.json'
      - 'data/guide-pdf-changes.json'
      - 'detection.py'
      - 'email_templates.py'
      - 'validate_data.py'
      - 'test_monitor.py'
      - 'test_frontend.mjs'
      - 'test_import.mjs'
      - 'test_executive.mjs'
      - 'test_operations.mjs'
      - 'test_operations_auto.mjs'
      - 'assets/operations-auto.js'
      - 'test_operations_team.mjs'
      - 'assets/operations-team.js'
      - 'operations-team.html'
      - 'supabase/migrations/**'
      - 'data/team-ops-config.json'
      - 'assets/operations-model.js'
      - 'operations.html'
      - 'assets/executive-report.js'
      - 'executive-brief.html'
      - 'assets/workforce-import.js'
      - 'workforce-import.html'
      - 'data/salic-workforce.json'
      - 'data/official-inspections.json'
      - 'data/decisions.json'
      - 'data/guide-matching.json'
      - 'assets/workforce-model.js'
      - 'assets/calculator.js'
      - 'guide-audit.html'
      - 'data/source-registry.json'
      - '.github/workflows/radar.yml'
  schedule:
    # 08:15 and 17:15 Riyadh time (UTC+3). GitHub schedules can be delayed.
    - cron: '15 5,14 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Send a test email only (do not scan ministry)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: saudization-radar-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '465'
      SMTP_USER: ${{ secrets.RADAR_SMTP_USER || secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD || secrets.SMTP_PASSWORD }}
      ALERT_EMAIL: ${{ secrets.RADAR_EMAIL_TO || secrets.ALERT_EMAIL }}
      SMTP_FROM: ${{ secrets.RADAR_EMAIL_FROM || secrets.SMTP_FROM }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send explicit test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        run: python monitor.py --test-email
      - name: Validate monitor source and imports
        run: |
          python -m py_compile monitor.py email_templates.py detection.py validate_data.py test_monitor.py guide_pdf_monitor.py test_guide_pdf_monitor.py
          python validate_data.py
          python -m unittest -v test_guide_pdf_monitor test_monitor
          node --check assets/workforce-model.js
          node --check assets/calculator.js
          node --check test_frontend.mjs
          node test_frontend.mjs
          node --check assets/workforce-import.js
          node test_import.mjs
          node --check assets/executive-report.js
          node --check test_executive.mjs
          node test_executive.mjs
          node --check assets/operations-model.js
          node --check test_operations.mjs
          node test_operations.mjs
          node --check assets/operations-auto.js
          node --check test_operations_auto.mjs
          node test_operations_auto.mjs
          node --check assets/operations-team.js
          node --check test_operations_team.mjs
          node test_operations_team.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ('data/decisions.json', 'data/source-registry.json'):
              json.loads(Path(path).read_text(encoding='utf-8'))
              print('Validated:', path)
          PY
      - name: Refresh official baseline from latest main
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Monitor HRSD pages for changes
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        run: python monitor.py
      - name: Install verified public PDF text extractor
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        run: python -m pip install 'PyMuPDF>=1.24,<1.27'
      - name: Compare original HRSD PDF guide text
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        run: python guide_pdf_monitor.py
      - name: Save updated radar data
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.send_test_email }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase of generated JSON is unsafe: conflicting scan timestamps and
          # extracted PDF baselines must be regenerated from the latest branch.
          for attempt in 1 2 3; do
            git add data/
            if git diff --cached --quiet; then
              echo "No scan changes to publish"
              exit 0
            fi
            git commit -m "Update Saudization Radar data"
            if git push origin HEAD:main; then
              echo "Published scan results on attempt $attempt"
              exit 0
            fi
            echo "Concurrent publication detected — refresh baseline and rescan."
            git fetch origin main
            git reset --hard origin/main
            python monitor.py
            python guide_pdf_monitor.py
          done
          echo "::error::Could not publish monitor results after 3 attempts"
          exit 1
