name: Investigate official decision page content areas
'on':
  push:
    branches: [fix/contextual-ministry-alerts-20261117]
    paths:
      - 'probe_ministry_alerts.py'
      - '.github/workflows/probe-ministry-alerts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python probe_ministry_alerts.py
