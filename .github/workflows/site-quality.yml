name: Saudization Radar site integrity

'on':
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'occupation-catalog.html'
      - 'completion.html'
      - 'assets/completion-model.js'
      - 'assets/completion.js'
      - 'advisor.html'
      - 'assets/evidence-advisor.js'
      - 'assets/advisor-ui.js'
      - 'test_evidence_advisor.mjs'
      - 'activity-review.html'
      - 'assets/activity-review-model.js'
      - 'assets/activity-review-ui.js'
      - 'test_activity_review.mjs'
      - 'phase-two.html'
      - 'vault.html'
      - 'assets/phase-two-model.js'
      - 'assets/phase-two-ui.js'
      - 'assets/local-vault.js'
      - 'assets/local-vault-ui.js'
      - 'assets/phase-two.css'
      - 'assets/v2-green-home.css'
      - 'assets/v2-home.js'
      - 'data/phase-two-plan.json'
      - 'test_phase_two.mjs'
      - 'test_local_vault.mjs'
      - 'test_completion.mjs'
      - 'assets/occupation-catalog.js'
      - 'data/occupation-catalog.json'
      - 'test_occupation_catalog.py'
      - 'sync_occupation_catalog.py'
      - 'intelligence.html'
      - 'sources.html'
      - 'review.html'
      - 'assets/**'
      - 'test_services_menu.mjs'
      - 'test_site_integrity.py'
      - 'test_report_builder.cjs'
      - 'data/grace-periods.json'
      - 'data/decisions.json'
      - 'data/occupations.json'
      - '.github/workflows/site-quality.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pages and local assets
        run: python -m unittest -v test_site_integrity.py test_occupation_catalog.py
      - name: Verify nine-workstream readiness and five safe plans
        run: node test_completion.mjs
      - name: Verify eight Phase II planning tools and local encrypted vault
        run: |
          node test_phase_two.mjs
          node test_local_vault.mjs
      - name: Verify local activity review and privacy gates
        run: node test_activity_review.mjs
      - name: Verify source-gated read-only advisor
        run: node test_evidence_advisor.mjs
      - name: Test compact services navigation and keyboard controls
        run: node test_services_menu.mjs
      - name: Validate JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done
      - name: Test executive report classification and grace periods
        run: node --test test_report_builder.cjs
