name: Saudization Radar site integrity

'on':
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'intelligence.html'
      - 'sources.html'
      - 'review.html'
      - 'assets/**'
      - 'test_site_integrity.py'
      - '.github/workflows/site-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pages and local assets
        run: python -m unittest -v test_site_integrity.py
      - name: Validate JavaScript syntax
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done
