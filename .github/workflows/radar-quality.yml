name: Radar quality checks
'on':
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'guide_pdf_monitor.py'
      - 'test_guide_pdf_monitor.py'
      - 'guide-changes.html'
      - 'data/guide-pdf-sources.json'
      - 'data/guide-pdf-changes.json'
      - 'detection.py'
      - 'email_templates.py'
      - 'test_*.py'
      - 'data/decisions.json'
      - 'data/occupations.json'
      - 'data/source-registry.json'
      - 'assets/workforce-import.js'
      - 'assets/workforce-model.js'
      - 'test_import.mjs'
      - 'test_executive.mjs'
      - 'test_operations.mjs'
      - 'test_operations_auto.mjs'
      - 'test_salic_scope.mjs'
      - 'test_salic_applicability.mjs'
      - 'assets/salic-scope.js'
      - 'salic-applicability.html'
      - 'data/salic-applicability.json'
      - 'data/salic-activities.json'
      - 'assets/intelligence.js'
      - 'assets/salic.js'
      - 'assets/operations-auto.js'
      - 'test_operations_team.mjs'
      - 'assets/operations-team.js'
      - 'operations-team.html'
      - 'supabase/migrations/**'
      - 'data/team-ops-config.json'
      - 'assets/operations-model.js'
      - 'operations.html'
      - 'assets/executive-report.js'
      - 'executive-brief.html'
      - 'test_frontend.mjs'
      - 'test_services_menu.mjs'
      - 'assets/services-menu.css'
      - 'assets/services-menu.js'
      - 'validate_data.py'
      - 'email_probe.py'
      - 'data/guide-matching.json'
      - 'workforce-import.html'
      - 'decision-audit.html'
      - 'index.html'
      - 'occupation-catalog.html'
      - 'completion.html'
      - 'assets/completion-model.js'
      - 'assets/completion.js'
      - 'advisor.html'
      - 'assets/evidence-advisor.js'
      - 'assets/advisor-ui.js'
      - 'test_evidence_advisor.mjs'
      - 'activity-review.html'
      - 'assets/activity-review-model.js'
      - 'assets/activity-review-ui.js'
      - 'test_activity_review.mjs'
      - 'phase-two.html'
      - 'vault.html'
      - 'assets/phase-two-model.js'
      - 'assets/phase-two-ui.js'
      - 'assets/local-vault.js'
      - 'assets/local-vault-ui.js'
      - 'assets/phase-two.css'
      - 'assets/v2-green-home.css'
      - 'assets/v2-home.js'
      - 'data/phase-two-plan.json'
      - 'test_phase_two.mjs'
      - 'test_local_vault.mjs'
      - 'assets/v3-approved-dashboard.css'
      - 'assets/v3-dashboard-model.js'
      - 'assets/v3-approved-dashboard.js'
      - 'assets/kafd-hero.webp'
      - 'test_approved_dashboard.mjs'
      - 'assets/v4-reference-dashboard.css'
      - 'assets/v4-reference-dashboard.js'
      - 'assets/v4-icons.svg'
      - 'assets/v4-skyline.svg'
      - 'test_reference_dashboard.mjs'
      - 'test_completion.mjs'
      - 'assets/occupation-catalog.js'
      - 'data/occupation-catalog.json'
      - 'occupation-crosswalk.html'
      - 'data/salic-occupation-crosswalk.json'
      - 'assets/occupation-crosswalk-model.js'
      - 'assets/occupation-crosswalk-ui.js'
      - 'test_occupation_crosswalk.mjs'
      - 'test_occupation_catalog.py'
      - 'sync_occupation_catalog.py'
      - '.github/workflows/radar-quality.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python modules
        run: python -m py_compile monitor.py guide_pdf_monitor.py detection.py email_templates.py validate_data.py email_probe.py sync_occupation_catalog.py
      - name: Verify aggregate and legal reference data
        run: python validate_data.py
      - name: Run offline monitoring and data tests
        run: python -m unittest -v test_monitor.py test_monitor_health.py test_detection.py test_email_templates.py test_data_quality.py test_guide_pdf_monitor.py test_occupation_catalog.py
      - name: Validate SALIC 75-title code matrix, source provenance and private Qiwa cross-check
        run: |
          node --check assets/occupation-crosswalk-model.js
          node --check assets/occupation-crosswalk-ui.js
          node --check assets/workforce-import.js
          node test_occupation_crosswalk.mjs
      - name: Validate completion center and evidence-gated scenario logic
        run: |
          node --check assets/completion-model.js
          node --check assets/completion.js
          node test_completion.mjs
      - name: Verify pixel-proportioned reference layout and true data wiring
        run: |
          node --check assets/v4-reference-dashboard.js
          node test_reference_dashboard.mjs
      - name: Test actual light-green executive dashboard rebuild
        run: |
          node --check assets/v3-dashboard-model.js
          node --check assets/v3-approved-dashboard.js
          node test_approved_dashboard.mjs
      - name: Verify all eight Phase II tools, new green dashboard and AES-GCM vault
        run: |
          node --check assets/phase-two-model.js
          node --check assets/phase-two-ui.js
          node --check assets/local-vault.js
          node --check assets/local-vault-ui.js
          node --check assets/v2-home.js
          node test_phase_two.mjs
          node test_local_vault.mjs
      - name: Test local activity code comparison and privacy
        run: |
          node --check assets/activity-review-model.js
          node --check assets/activity-review-ui.js
          node test_activity_review.mjs
      - name: Test read-only source-gated advisor and safe UI
        run: |
          node --check assets/evidence-advisor.js
          node --check assets/advisor-ui.js
          node test_evidence_advisor.mjs
      - name: Verify compact services navigation
        run: |
          node --check assets/services-menu.js
          node test_services_menu.mjs
      - name: Frontend syntax and local secure-import regression tests
        run: |
          node --check assets/workforce-model.js
          node --check assets/workforce-import.js
          node --check assets/calculator.js
          node --check test_frontend.mjs
          node --check test_import.mjs
          node test_frontend.mjs
          node test_import.mjs
          node --check assets/executive-report.js
          node --check test_executive.mjs
          node test_executive.mjs
          node --check assets/operations-model.js
          node --check test_operations.mjs
          node test_operations.mjs
          node --check assets/operations-auto.js
          node --check test_operations_auto.mjs
          node test_operations_auto.mjs
          node --check test_salic_scope.mjs
          node test_salic_scope.mjs
          node --check assets/salic-scope.js
          node --check test_salic_applicability.mjs
          node test_salic_applicability.mjs
          node --check assets/operations-team.js
          node --check test_operations_team.mjs
          node test_operations_team.mjs
