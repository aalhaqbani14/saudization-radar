name: Radar quality checks
'on':
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'detection.py'
      - 'email_templates.py'
      - 'test_*.py'
      - 'data/decisions.json'
      - 'data/occupations.json'
      - 'data/source-registry.json'
      - 'assets/workforce-import.js'
      - 'assets/workforce-model.js'
      - 'test_import.mjs'
      - 'test_executive.mjs'
      - 'test_operations.mjs'
      - 'test_operations_auto.mjs'
      - 'assets/operations-auto.js'
      - 'test_operations_team.mjs'
      - 'assets/operations-team.js'
      - 'operations-team.html'
      - 'supabase/migrations/**'
      - 'data/team-ops-config.json'
      - 'assets/operations-model.js'
      - 'operations.html'
      - 'assets/executive-report.js'
      - 'executive-brief.html'
      - 'test_frontend.mjs'
      - 'validate_data.py'
      - 'email_probe.py'
      - 'data/guide-matching.json'
      - 'workforce-import.html'
      - 'decision-audit.html'
      - 'index.html'
      - '.github/workflows/radar-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python modules
        run: python -m py_compile monitor.py detection.py email_templates.py validate_data.py email_probe.py
      - name: Verify aggregate and legal reference data
        run: python validate_data.py
      - name: Run offline monitoring and data tests
        run: python -m unittest -v test_monitor.py test_monitor_health.py test_detection.py test_email_templates.py test_data_quality.py
      - name: Frontend syntax and local secure-import regression tests
        run: |
          node --check assets/workforce-model.js
          node --check assets/workforce-import.js
          node --check assets/calculator.js
          node --check test_frontend.mjs
          node --check test_import.mjs
          node test_frontend.mjs
          node test_import.mjs
          node --check assets/executive-report.js
          node --check test_executive.mjs
          node test_executive.mjs
          node --check assets/operations-model.js
          node --check test_operations.mjs
          node test_operations.mjs
          node --check assets/operations-auto.js
          node --check test_operations_auto.mjs
          node test_operations_auto.mjs
          node --check assets/operations-team.js
          node --check test_operations_team.mjs
          node test_operations_team.mjs
