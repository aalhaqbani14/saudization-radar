name: Probe pending HRSD occupational guide sources
'on':
  push:
    branches: [feat/expand-official-guide-review-20261117]
    paths:
      - 'probe_pending_pdf_sources.py'
      - '.github/workflows/probe-pending-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.7
      - run: python probe_pending_pdf_sources.py
