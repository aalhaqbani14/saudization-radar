name: Probe HRSD occupation browser pagination
'on':
  push:
    branches: [feat/complete-occupation-taxonomy]
    paths:
      - 'probe_occupations.mjs'
      - 'probe_occupation_urls.py'
      - '.github/workflows/probe-occupation-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          python --version
      - name: Probe official ministry pagination
        run: python probe_occupation_urls.py
