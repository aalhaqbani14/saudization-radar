<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 188" role="img" aria-label="فريق عمل في اجتماع">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e3f6f0"/><stop offset="1" stop-color="#f8fcff"/></linearGradient><linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#126c6f"/><stop offset="1" stop-color="#2ab8a3"/></linearGradient></defs>
<style>
.person{animation:bob 5s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}.person.two{animation-delay:-1.7s}.person.three{animation-delay:-3.1s}.arm{animation:wave 4s ease-in-out infinite;transform-origin:top center;transform-box:fill-box}.note{animation:float 5.5s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
